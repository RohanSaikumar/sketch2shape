# Sketch2Shape settings. Values marked "calibrate" are first guesses, to tune on the test sketches.

runs_dir: runs
time_budget_s: 900            # whole run; retries stop once this is spent and the best result so far is exported
worker_timeout_s: 1800        # one GPU worker job; the first run also downloads the model weights

gpus:                         # each heavy step runs in its own worker process on this GPU (T4: 15 GB)
  sdxl: 0                     # SDXL + ControlNet: 13.4 GB peak for 2 images
  hunyuan: 1                  # Hunyuan3D-2 shape (<= 9.4 GB), then texture (12.8 GB); 0 also works on a single GPU

workers:                      # only with two GPUs; on one GPU every step loads its model in a fresh worker
  keep_loaded: [generate]     # SDXL stays loaded between runs (~1 min less per run after the first)
  load_shape_early: true      # the shape model loads on GPU 1 while the image is made (~1 min less per run)
  min_free_ram_gb: 16         # a model loads early only with this much RAM free (each Hunyuan load peaks ~15 GB)

preprocess:
  size: 1024
  pad_ratio: 0.12
  min_stroke_ratio: 0.001     # below this share of stroke pixels the canvas counts as empty
  speck_area_px: 20           # specks smaller than this (at 1024 x 1024) are dropped

understand:
  llm:
    enabled: true             # one optional vision call that names the sketch; CLIP is used without a key
    provider: auto            # auto = OpenAI if OPENAI_API_KEY is set, else Claude if ANTHROPIC_API_KEY; or openai / anthropic
    openai_models: [gpt-4.1-mini, gpt-5-mini, gpt-4o-mini]   # tried in order; the first one the key can use is used
    anthropic_model: claude-opus-5-5
    effort: low               # Claude only
    server_fallback: true     # Claude only: re-run on a fallback model if the request is declined
    timeout_s: 30
  clip_model: openai/clip-vit-base-patch32
  clip_min_confidence: 0.25   # calibrate

generate:
  base_model: stabilityai/stable-diffusion-xl-base-1.0
  controlnet: xinsir/controlnet-scribble-sdxl-1.0
  vae: madebyollin/sdxl-vae-fp16-fix
  control_polarity: bw        # bw = black lines on white; the Kaggle trial showed both polarities work
  candidates: 2               # images per round; the vision-LLM check picks one (1 without an LLM key: no check)
  size: 1024                  # SDXL's native size: 768 px saved ~10 s but gave simpler, softer images
  steps: 25
  guidance_scale: 6.0
  control_scale: 0.7
  control_scale_step: 0.1
  max_control_scale: 1.0
  seed: 42
  # "real volume" and the flat-object negatives stop outline sketches (e.g. a cartoon cat) becoming flat plaques;
  # the frame and scenery negatives stop a drawn outline becoming a ring around the object or a scene behind it;
  # the reflection negatives keep glossy highlights from being baked into the texture. Each prompt must stay
  # within CLIP's 77 tokens (SDXL drops the rest), with room for the image check's "avoid" words in front.
  prompt_suffix: "single three-dimensional object with real volume, plain white background, centered, entire object visible, studio photo, soft even lighting, high detail"
  negative_prompt: "multiple objects, cropped, picture frame, border, scenery, text, watermark, cast shadow, ground, blurry, sketch, drawing, hands, people, flat, 2D, relief, plaque, cookie cutter, sticker, glossy, reflections, specular highlights"
  realism:                    # added unless a typed description asks for a style (cartoon, toy, low poly, ...)
    prompt: "photorealistic, realistic proportions, natural colours and textures"
    negative_prompt: "3d render, cartoon, figurine"
  clean:                      # a clean drawing (or no LLM judgement): the 1 Nov morning settings, which won the
                              # comparison on the watering can and headphones; GPT's words there added mistakes
                              # ("spout with rose" -> a flower, "black plastic" -> a dark background)
    prompt_suffix: "single object, centered, entire object visible, product photo, plain white background, soft even studio lighting, high detail"
    negative_prompt: "multiple objects, cropped, picture frame, border, text, watermark, cast shadow, ground, scene, cluttered background, blurry, sketch, line art, drawing, hands, people, liquid"
    candidates: 1             # these settings are reliable; one image saves ~38 s (the check still retries a bad one)
  rough:                      # the LLM naming call judged the sketch a quick or cartoon-style doodle (never without a key)
    control_scale: 0.7        # compared with 0.55 for 60%: equally good cats and closer to the drawing
    control_end: 0.8          # the sketch guides the first 80% of the steps, then the model is free
  scene:                      # the naming call saw a landscape or several things: made as a miniature diorama
    control_scale: 0.3        # a scene's lines do not fit one object, so the sketch only hints at the layout
    control_end: 0.4
    negative_prompt: "cropped, picture frame, border, sky, landscape background, text, watermark, cast shadow, blurry, sketch, drawing, people, flat, 2D, relief, plaque, sticker, glossy, reflections, specular highlights"

score:
  threshold: 0.35             # calibrate
  max_rounds: 2               # extra generation rounds when no candidate passes
  edge_tolerance: 0.02        # share of the image width a sketch line may be off by
  weights: {edges: 0.5, silhouette: 0.3, clip: 0.2}

prepare:
  margin: 0.15
  size: 1024
  min_mask_ratio: 0.03
  max_mask_ratio: 0.95

reconstruct:
  model: tencent/Hunyuan3D-2
  shape_subfolder: hunyuan3d-dit-v2-0-turbo
  shape_steps: 5
  octree_resolution: 380      # marching-cubes grid (Hunyuan's default); 256 saved a few seconds but lost fine detail
  flashvdm: true
  seed: 1234
  max_shape_attempts: 2
  texture: true
  paint_cpu_offload_on_oom: true
  paint_delight: true         # Hunyuan's light-removal step before texturing (scripts/compare_settings.py --paint tests it)

validate:
  min_faces: 500
  min_flatness: 0.08          # smallest / largest bounding-box side; below this the model is a flat plate
  max_fragment_share: 0.02    # loose pieces smaller than this share of the surface are removed

export:
  formats: [glb, obj]
  normalize: true             # centre, scale to 1 unit, rest on y = 0
  flip_projection_x: false    # flip if projected fallback colours come out mirrored
